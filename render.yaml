services:
  - type: worker
    name: sara-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        sync: false

      - key: OPENROUTER_FALLBACK_MODEL
        sync: false

      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/sara.db

      - key: TIMEZONE
        value: Asia/Tashkent

      - key: MEMORY_ENABLED
        value: "true"

      - key: PROACTIVE_GROUP_MODE
        value: "true"

      - key: REMINDER_ENABLED
        value: "true"

      - key: BOT_TO_BOT_MODE
        value: "true"

      - key: MEDIA_ENABLED
        value: "true"

      - key: MAX_RECENT_MESSAGES
        value: "100"

      - key: MAX_MEMORY_RESULTS
        value: "15"

      - key: MAX_CONTEXT_TOKENS
        value: "12000"

      - key: PROACTIVE_COOLDOWN_SECONDS
        value: "300"

      - key: QUIET_GROUP_INTERVAL_SECONDS
        value: "3600"

      - key: MAX_BOT_CHAIN
        value: "5"

      - key: BOT_TO_BOT_COOLDOWN_SECONDS
        value: "30"

      - key: USER_RATE_LIMIT_SECONDS
        value: "1"

      - key: GROUP_RATE_LIMIT_SECONDS
        value: "1"

      - key: LOG_LEVEL
        value: INFO
